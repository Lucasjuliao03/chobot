name: Ping Render Health

on:
  schedule:
    # a cada 5 minutos
    - cron: "2-59/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Curl /health
        run: |
          set -e
          URL="https://chobot-1.onrender.com/health"
          echo "Pinging $URL"
          curl -sS -m 20 -o /tmp/resp.txt -w "HTTP=%{http_code} TIME=%{time_total}\n" "$URL"
          cat /tmp/resp.txt
